<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06b6d4" />

    <!-- Supporto per iPhone, iPad e macOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Virtuoso DJ" />

    <!-- Collegamento Icone e Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Virtuoso DJ Studio - Pro Virtual DJ for Mac &amp; iOS</title>
    <meta name="description" content="Professional responsive DJ mixer inspired by VirtualDJ for Mac and iOS with Web Audio DSP, interactive jog wheels, AI Stems isolation, harmonic mixing, and Gemini AI AutoMix." />
    <meta property="og:title" content="Virtuoso DJ Studio - Pro Virtual DJ for Mac &amp; iOS" />
    <meta property="og:description" content="Professional responsive DJ mixer inspired by VirtualDJ for Mac and iOS with Web Audio DSP, interactive jog wheels, AI Stems isolation, harmonic mixing, and Gemini AI AutoMix." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Registrazione Service Worker per installazione PWA e supporto offline -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Virtuoso DJ Service Worker registrato con successo:', registration.scope);
            })
            .catch((error) => {
              console.error('Errore registrazione Service Worker:', error);
            });
        });
      }
    </script>
  </body>
</html>
